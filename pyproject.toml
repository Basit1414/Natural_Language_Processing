[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bis-speech-nlp"
version = "1.0.0"
description = "Reproducible exploration and policy-tone analysis of the BIS central-bank speech archive"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abdul Alhassan"}]
dependencies = [
  "joblib>=1.3",
  "ipykernel>=6.29",
  "ipython>=8.20",
  "matplotlib>=3.8",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "requests>=2.31",
  "scikit-learn>=1.6",
  "scipy>=1.11",
  "seaborn>=0.13",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
